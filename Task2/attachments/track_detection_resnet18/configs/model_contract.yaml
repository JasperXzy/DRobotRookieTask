schema_version: 1
status: final

source_image:
  width: 640
  height: 480
  color_format: BGR
  resize_interpolation: bilinear

roi:
  x: 0
  y: 256
  width: 640
  height: 224
  python_slice: "frame[256:480, 0:640]"

coordinate_system:
  space: roi
  origin: top_left
  x_axis: right
  y_axis: down
  x_range: "[0, 640)"
  y_range: "[0, 224)"
  x_normalization: "x_norm = 2 * x_roi / 640 - 1"
  y_normalization: "y_norm = 2 * y_roi / 224 - 1"
  x_denormalization: "x_roi = (x_norm + 1) * 320"
  y_denormalization: "y_roi = (y_norm + 1) * 112"
  full_image_mapping: "x_full = x_roi; y_full = y_roi + 256"

model_input:
  name: input
  shape: [1, 3, 224, 224]
  dtype: float32
  color_format: RGB
  layout: NCHW
  resize_interpolation: bilinear
  value_scale: "uint8 / 255.0"
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

model_output:
  name: output
  shape: [1, 3]
  dtype: float32
  values:
    - x_norm
    - y_norm
    - track_logit
  confidence_postprocess: "sigmoid(track_logit)"
  coordinate_loss_mask: "has_track == 1"

onnx:
  opset: 11
  fixed_batch: 1
  dynamic_axes: false
